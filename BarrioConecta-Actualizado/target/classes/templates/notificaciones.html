<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Avisos')}"></head><body><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: sos-bubble}"></div>
<main class="container py-4"><div class="mx-auto" style="max-width:720px">
 <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="section-title h3 mb-1"><i class="bi bi-bell-fill me-2 text-success"></i>Mis avisos</h1><p class="muted small mb-0">Cuando alguien responda a tus solicitudes o acepte tu ayuda, lo verás aquí.</p></div><button type="button" id="enable-push" class="btn btn-sm btn-outline-success d-none"><i class="bi bi-bell me-1"></i>Activar avisos del navegador</button></div>
 <div class="notif-item" th:each="n : ${notificaciones}" th:classappend="${nuevas.contains(n.id)} ? ' nueva'">
  <i class="bi bi-chat-dots-fill"></i>
  <div class="flex-grow-1"><div th:text="${n.mensaje}"></div><div class="small muted" th:text="${n.fecha}"></div></div>
  <a th:if="${n.enlace != null}" class="btn btn-sm btn-outline-success" th:href="@{${n.enlace}}">Ver</a>
 </div>
 <div class="empty-state" th:if="${#lists.isEmpty(notificaciones)}">No tienes avisos todavía.</div>
</div></main><div th:replace="~{fragments :: footer}"></div><div th:replace="~{layout :: scripts}"></div></body></html>
