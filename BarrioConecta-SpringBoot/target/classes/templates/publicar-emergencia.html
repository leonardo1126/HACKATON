<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Reportar necesidad')}"></head><body><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: sos-bubble}"></div><div class="container py-4"><div class="content-card mx-auto" style="max-width:760px"><div class="official-warning mb-3"><i class="bi bi-exclamation-triangle-fill"></i><div><strong>Si hay peligro inmediato, llama al <a href="tel:105">105</a>, <a href="tel:116">116</a> o <a href="tel:106">106</a>.</strong><span>Este formulario pide ayuda a tus vecinos; no avisa a las autoridades.</span></div></div><h1 class="h3 fw-bold text-danger">Necesito ayuda</h1><p class="muted">Describe qué apoyo necesitas. Aparecerá como «Pendiente» y los vecinos podrán ofrecerte ayuda.</p><form th:action="@{/emergencias/nuevo}" method="post" class="row g-3" data-offline="true" data-offline-label="tu solicitud"><div class="col-md-6"><label class="form-label">Tipo de necesidad</label><select class="form-select" name="categoria" required><option value="">Seleccionar</option><option th:each="c : ${catEmergencia}" th:value="${c}" th:text="${c}"></option></select></div><div class="col-md-6"><label class="form-label">Título</label><input class="form-control" name="titulo" required></div><div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="4" required></textarea></div><div class="col-12"><label class="form-label">Ubicación aproximada</label><input id="latitud" type="hidden" name="latitud" th:value="${latitudActual}"><input id="longitud" type="hidden" name="longitud" th:value="${longitudActual}"><div class="location-picker"><div class="input-group mb-2"><input id="location-search" class="form-control" placeholder="Busca una dirección o lugar"><button id="location-search-btn" type="button" class="btn btn-outline-secondary">Buscar</button></div><div id="location-map" class="location-picker-map"></div><div class="d-flex flex-wrap gap-2 mt-2"><button type="button" id="use-location" class="btn btn-outline-secondary btn-sm">Usar mi ubicación actual</button><span id="location-status" class="form-text align-self-center">Busca un lugar o toca el mapa para marcarlo.</span></div></div></div><div class="col-12"><button class="btn btn-danger">Enviar reporte</button><a th:href="@{/emergencias}" class="btn btn-outline-secondary">Cancelar</a></div></form></div></div><div th:replace="~{fragments :: footer}"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script th:src="@{/js/location-picker.js}"></script><div th:replace="~{layout :: scripts}"></div></body></html>
