<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ingresar')}"></head>
<body class="auth-page">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: sos-bubble}"></div>
<main class="container auth-container">
 <section class="auth-showcase">
  <div class="auth-art" aria-hidden="true">
   <div class="auth-art-sun"></div><div class="auth-art-building building-one"></div><div class="auth-art-building building-two"></div>
   <div class="auth-art-people"><i class="bi bi-person-fill"></i><i class="bi bi-person-fill"></i><i class="bi bi-person-fill"></i><i class="bi bi-person-fill"></i></div>
   <div class="auth-art-caption"><i class="bi bi-heart-fill me-2"></i>Una comunidad que se ayuda</div>
  </div>
  <div class="auth-form-panel">
   <div class="auth-brand"><span class="auth-brand-icon"><i class="bi bi-people-fill"></i></span><div><h1>Barrio Conecta</h1><p>Ingresa para conectar con tus vecinos</p></div></div>
   <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
   <form th:action="@{/login}" method="post" class="auth-form">
    <label class="auth-input"><i class="bi bi-envelope-fill"></i><input type="email" name="correo" placeholder="Email" aria-label="Correo electrónico" required></label>
    <label class="auth-input"><i class="bi bi-lock-fill"></i><input type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" required></label>
    <div class="auth-options"><span><i class="bi bi-shield-lock me-1"></i>Acceso seguro</span><span>Tu comunidad te espera</span></div>
    <button class="btn btn-bc btn-lg w-100 auth-submit">Ingresar <i class="bi bi-arrow-right ms-1"></i></button>
   </form>
   <p class="auth-register">¿Aún no tienes cuenta? <a th:href="@{/registro}">Crear cuenta gratis</a></p>
  </div>
 </section>
</main>
<div th:replace="~{fragments :: footer}"></div><div th:replace="~{layout :: scripts}"></div>
</body></html>
